name: Deploy to GitHub Pages

# Manual-only for now: GitHub Pages is not available for a private repository
# on the free plan, so an automatic push trigger would fail on every commit.
#
# To publish the site later, either make the repository public or upgrade to
# GitHub Pro, then set Settings -> Pages -> Source to "GitHub Actions" and
# uncomment the `push` trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; queued runs are superseded, not cancelled
# mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Validates the question bank, type-checks, then builds to dist/.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
